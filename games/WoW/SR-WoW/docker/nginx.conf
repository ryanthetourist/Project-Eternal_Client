# Static hosting for the WoW Eternal web build.
# Cross-origin isolation (COOP/COEP) is required by browsers for SharedArrayBuffer, which the pthread WebAssembly build uses.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index WoW.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    include /etc/nginx/mime.types;
    types { application/wasm wasm; }
    gzip on;
    gzip_types application/wasm application/javascript text/css application/json;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(wasm|js|css|ico)$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=3600";
    }
}
